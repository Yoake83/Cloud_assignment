apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: cmdparser
servers: 1
agents: 0
ports:
  - port: 8080:80          # Traefik ingress -> http://localhost:8080
    nodeFilters:
      - loadbalancer
  - port: 8333:30833       # SeaweedFS S3 (NodePort) -> http://localhost:8333, used by the laptop-side scripts
    nodeFilters:
      - server:0
