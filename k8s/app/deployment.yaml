apiVersion: apps/v1
kind: Deployment
metadata: {name: cmdparser, namespace: app}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector: {matchLabels: {app: cmdparser}}
  template:
    metadata: {labels: {app: cmdparser}}
    spec:
      containers:
        - name: service
          image: cmdparser-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - {containerPort: 8000, name: http}
          env:
            - {name: MODEL_URI, value: "s3://models/v1/"}
            - {name: MODEL_VERSION, value: "v1"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data.svc.cluster.local:8333"}
            - {name: MAX_NEW_TOKENS, value: "80"}
            - {name: FAULT_INJECT, value: "0"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: s3-credentials, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: s3-credentials, key: AWS_SECRET_ACCESS_KEY}}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 2
