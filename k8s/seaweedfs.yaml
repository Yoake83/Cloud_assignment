# SeaweedFS (master + volume + filer + S3 gateway in one pod). The S3 identities come from the
# Secret `seaweedfs-s3-config`, which scripts/gen-secrets.sh creates; no credentials are stored in Git.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: seaweedfs-data, namespace: data}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: seaweedfs, namespace: data}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: seaweedfs}}
  template:
    metadata: {labels: {app: seaweedfs}}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.80
          args: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-master.volumeSizeLimitMB=256", "-volume.max=100",
                 "-filer", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
          ports:
            - {containerPort: 8333, name: s3}
          readinessProbe:
            tcpSocket: {port: 8333}
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: s3-config, mountPath: /etc/seaweedfs, readOnly: true}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: seaweedfs-data}
        - name: s3-config
          secret: {secretName: seaweedfs-s3-config}
---
apiVersion: v1
kind: Service
metadata: {name: seaweedfs, namespace: data}
spec:
  selector: {app: seaweedfs}
  ports:
    - {name: s3, port: 8333, targetPort: 8333}
---
apiVersion: v1
kind: Service
metadata: {name: seaweedfs-nodeport, namespace: data}
spec:
  type: NodePort
  selector: {app: seaweedfs}
  ports:
    - {name: s3, port: 8333, targetPort: 8333, nodePort: 30833}
