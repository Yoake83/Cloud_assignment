# Everything `make train` needs is in this file (version v1).
version: v1
base_model: EleutherAI/pythia-70m
train_file: data/train.jsonl        # produced by worker/clean.py
max_train_examples: 1500            # the first 1,500 records only
seed: 42
learning_rate: 0.0002
batch_size: 16
epochs: 5
max_seq_length: 128
warmup_ratio: 0.05
weight_decay: 0.0
output_dir: artifacts/v1
loss_csv: training/loss.csv
library_versions:
  python: "3.11"
  torch: "2.4.1"
  transformers: "4.44.2"
  numpy: "1.26.4"
